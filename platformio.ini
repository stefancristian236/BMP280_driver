[env:nucleo_f030r8]
platform = ststm32
board = nucleo_f030r8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

build_type = debug
build_flags = 
    -O0
    -g3
    -ggdb

debug_init_break = tbreak main

debug_extra_cmds =
    monitor reset_config none
    monitor reset halt
    set $sp = *(unsigned int*)0x08000000
    set $pc = *(unsigned int*)0x08000004